# hackerscad.com is built from the "site" branch and from the docs here: when they change, the site
# branch's workflow (pages.yml) is started again, on that branch
name: site-trigger

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "source/hackerscad/lang/lexer.d"

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Build the site again
        run: gh workflow run pages.yml --ref site --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
