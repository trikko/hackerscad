# The site is built and published by main's workflow site.yml (a workflow started by hand must live in
# the default branch): a push here starts it
name: site-changed

on:
  push:
    branches: [site]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Build the site again
        run: gh workflow run site.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
