# Opens the packages of a release on Linux, Windows and macOS, on the startup
# example, and saves a screenshot of each as an artifact of the run. When a
# release is published the screenshots also go to the "screenshots" branch,
# shown in the README. By hand (Actions > screenshots > Run workflow): the
# tag typed in the form, or the tag chosen as "Use workflow from", or else
# the most recent release (pre-releases such as nightly included); "publish"
# puts them in the README too.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: nightly, v0.3.1… (empty: the tag chosen above, or the most recent release)"
        required: false
        default: ""
      publish:
        description: "Also show them in the README (the screenshots branch)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write   # draft releases are visible only with write access

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  # the release to try, for the three jobs below
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          tag="${TAG:-$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName')}"
          [ -n "$tag" ] || { echo "no release to try" >&2; exit 1; }
          echo "Trying release $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: gh release download "${{ needs.release.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p '*.AppImage' -D dist
      - name: Screenshot
        timeout-minutes: 5
        # mutter (GNOME's window manager) composes the window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mutter imagemagick dbus-x11 libgl1-mesa-dri \
            ubuntu-wallpapers
          chmod +x dist/*.AppImage
          # GLX: under Xvfb, libGL does not see the EGL contexts GTK would make
          export APPIMAGE_EXTRACT_AND_RUN=1 GDK_BACKEND=x11 GDK_DEBUG=gl-glx
          # the virtual session sometimes fails to start: up to three tries
          for try in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1080x24" bash -c \
              "dbus-run-session mutter --x11 --replace & sleep 5; tests/screenshot.sh linux dist/hackerscad-*.AppImage" || true
            [ -f window-linux.png ] && break
            echo "no screenshot, trying again"
          done
          [ -f window-linux.png ]
      # mutter alone draws no wallpaper: the screen image is the window taken
      # by hackerscad, in the middle of Ubuntu's wallpaper, with a shadow
      - name: On the wallpaper
        run: |
          wall=/usr/share/backgrounds/warty-final-ubuntu.png   # the release's default
          ls -l "$wall"
          convert "$wall" -resize 1920x1080^ -gravity center -extent 1920x1080 \
            \( window-linux.png \( +clone -background black -shadow 50x18+0+12 \) +swap \
               -background none -layers merge +repage \) \
            -gravity center -composite screen-linux.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-linux
          path: "*-linux.png"

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        shell: bash
        run: gh release download "${{ needs.release.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p '*windows*.zip' -D dist
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip
      - name: Unpack
        shell: msys2 {0}
        # both zips (Mesa's lands in the same folder): the runner has no
        # graphics card
        run: for z in dist/*.zip; do unzip -q -o "$z" -d out; done
      # started as a user would; the runner has no graphics card, so the
      # application picks the Mesa OpenGL it ships with
      - name: Screenshot
        timeout-minutes: 5
        shell: msys2 {0}
        # the runner's screen is 1024x768: 1920x1080, as on Linux and macOS
        run: |
          powershell -NoProfile -Command "Set-DisplayResolution -Width 1920 -Height 1080 -Force" || true
          tests/screenshot.sh windows out/hackerscad/hackerscad.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: "*-windows.png"

  macos:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          gh release download "${{ needs.release.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p '*macos*.zip' -D dist
          ditto -x -k dist/*.zip out
      # the runner's desktop is black: one of the system's wallpapers
      - name: Wallpaper
        continue-on-error: true
        run: |
          ls "/System/Library/Desktop Pictures" || true
          wall="$(ls "/System/Library/Desktop Pictures"/*Sonoma*.heic 2>/dev/null | head -1)"
          [ -n "$wall" ] || wall="$(ls "/System/Library/Desktop Pictures"/*.heic | head -1)"
          echo "wallpaper: $wall"
          osascript -e "tell application \"System Events\" to tell every desktop to set picture to \"$wall\""
          sleep 2
      - name: Screenshot
        timeout-minutes: 5
        run: tests/screenshot.sh macos out/hackerscad.app/Contents/MacOS/hackerscad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-macos
          path: "*-macos.png"

  # the README shows the screenshots from the "screenshots" branch
  publish:
    needs: [release, linux, windows, macos]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          merge-multiple: true
          path: screenshots
      - name: Push to the screenshots branch
        working-directory: screenshots
        run: |
          tag="${{ needs.release.outputs.tag }}"
          printf 'Screenshots of hackerscad %s, taken by the screenshots workflow.\n' "$tag" > README.md
          git init -q -b screenshots
          git add screen-*.png README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of $tag"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
