<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- hackerscad on macOS lays text out with fontconfig (see launcher.sh): the
     fonts a Mac would use, for GTK's name of the system font and for the
     generic families -->
<fontconfig>
  <alias binding="same">
    <family>.AppleSystemUIFont</family>
    <prefer><family>Helvetica Neue</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Helvetica Neue</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Menlo</family></prefer>
  </alias>
</fontconfig>
