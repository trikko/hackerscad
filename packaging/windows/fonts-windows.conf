<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- hackerscad on Windows lays text out with fontconfig (see hcadFonts in
     gui/app.d), in Adwaita Sans and Mono, which come with it, as on Linux;
     the Windows fonts stay for the letters these lack -->
<fontconfig>
  <dir prefix="relative">../../../share/fonts/adwaita</dir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Adwaita Mono</family></prefer>
  </alias>
</fontconfig>
